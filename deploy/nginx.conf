# nginx для «Живой ленты».
#
# Подставьте свой домен вместо example.com и свой путь к сертификату.
# Потом: sudo ln -sf /etc/nginx/sites-available/live-feed /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# 4.1: ограничиваем перебор адресов событий. 15 запросов в секунду без
# отказа — это приглашение к сканированию: адреса короткие, и перебрать их
# можно за минуту. 5 запросов в секунду с небольшим запасом хватает живому
# гостю, а сканер упрётся в 429.

limit_req_zone $binary_remote_addr zone=lf_events:10m rate=5r/s;

# --- редирект на https и выпуск сертификата -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # ACME-челлендж должен оставаться на http, иначе сертификат не продлится
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- основной сервер ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # скрипты и стили только свои, внешние подключения не нужны
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    # фото до 15 МБ на загрузку плюс запас на multipart-обвязку
    client_max_body_size 20m;

    access_log /var/log/nginx/live-feed.access.log;
    error_log  /var/log/nginx/live-feed.error.log;

    # 4.1: перебор адресов событий режем на корню. 429, а не тишина: гость
    # с нормальной скоростью пройдёт, сканер — нет.
    location /e/ {
        limit_req zone=lf_events burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket: без этих заголовков живой показ не заработает
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # показ слайдов идёт долго без запросов — таймаут должен быть длинным
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 4.1: openapi не отдаём вообще — он раскрывает все маршруты
    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }

    # 4.1: фото больше не публичные — кешируем только приватно
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires off;
        add_header Cache-Control "private";
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
