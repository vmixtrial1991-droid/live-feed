# Живая лента — запуск одной командой:
#
#   cp .env.example .env
#   # впишите в .env пароль и, если есть, домен
#   docker compose up -d
#
# В .env обязателен ADMIN_PASSWORD. Остальное можно не трогать.
#
# Образ можно привезти готовым: положите рядом livefeed-<версия>-images.tar.gz
# и выполните docker load -i livefeed-<версия>-images.tar.gz. Compose возьмёт
# готовый образ, а если образа нет — соберёт его сам. Версию подставьте из
# строки image: ниже, чтобы имя архива совпало с образом.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Имя образа с версией: тот же комплект можно положить на сервер заранее
    # (docker load) — тогда compose возьмёт готовый, а если образа нет,
    # соберёт его сам. Собирается только когда образа нет.
    image: livefeed:5.1.2
    container_name: live-feed-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-data:/app/data
      # сертификат нужен приложению, чтобы понять, можно ли уже гонять
      # редирект на https и ставить флаг Secure на cookie. Только чтение.
      - certs:/etc/letsencrypt:ro
    # наружу контейнер не публикуем: порт отдаёт только nginx
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: live-feed-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # без права на запись образ nginx не сможет подправить default.conf
      # при старте, поэтому монтируем обычным образом, а не :ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf
      # скрипт лежит вне /docker-entrypoint.d, чтобы выполнялся ровно один раз
      - ./deploy/docker/entrypoint.sh:/scripts/letsencrypt.sh
      - certs:/etc/letsencrypt
      # корень, который отдаётся наружу для проверки домена
      - acme-www:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    # sh, а не прямой запуск: не зависит от прав на файл после копирования репозитория
    command: ["sh", "-c", "sh /scripts/letsencrypt.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]

volumes:
  app-data:
  certs:
  acme-www: