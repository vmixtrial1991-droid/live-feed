# nginx для «Живой ленты» без домена: только http, сертификат не нужен.
#
# Это режим для теста во внутренней сети. На публичном интернете пароль
# модератора пойдёт открытым текстом — см. примечание в конце файла.
#
#   ln -sf /etc/nginx/sites-available/live-feed /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    # Порт 80, чтобы заходить по обычному http://АДРЕС
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;

    access_log /var/log/nginx/live-feed.access.log;
    error_log  /var/log/nginx/live-feed.error.log;

    # фото до 15 МБ на загрузку плюс запас на multipart-обвязку
    client_max_body_size 20m;

    # без https ослабляем часть заголовков: HSTS и CSP со строгими правилами
    # рассчитаны на защищённое соединение и тут только мешают отладке
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket: без этих заголовков живой показ не заработает
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # показ слайдов идёт долго без запросов — таймаут должен быть длинным
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# --- если позже появится домен ------------------------------------------------
# Поставьте nginx.conf вместо этого файла и выпустите сертификат:
#   apt-get install -y certbot python3-certbot-nginx
#   certbot --nginx -d example.ru
