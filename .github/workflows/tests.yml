name: Проверки

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      # матрица нужна, чтобы тесты шли и на 3.11, и на 3.12: разница в
      # поведении БД и Pillow между версиями ловится только так
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt websockets

      - name: Проверки без сервера
        run: |
          python test_proxy_networks.py
          python test_migration.py
          python test_cert_gate.py
          python test_frontend.py

      - name: Поднять приложение
        run: |
          python run.py --port 8123 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/api/health && break
            sleep 1
          done

      - name: Проверки против сервера
        run: |
          python check_admin_page.py
          python test_events.py
          python test_api.py
          python test_realtime.py
          python test_no_moderation.py

      - name: Остановить приложение
        if: always()
        run: pkill -f "run.py --port 8123" || true

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис скриптов установки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # shellcheck не знает про acme.sh и docker-команды, отключаем шум
          shellcheck -e SC1091 deploy/*.sh deploy/docker/*.sh

      - name: Проверка docker-compose
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=test/' .env
          # compose не должен требовать запущенного демона
          docker compose config > /dev/null
          echo "compose валиден"

      - name: Сборка образа
        run: docker compose build app
