<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/forms.css">
</head>
<body class="form-page">

<main class="card card-narrow">
  <div class="brand center">
    <span class="brand-dot"></span>
    <div>
      <h1 id="eventTitle">Живая лента</h1>
      <p class="muted" id="eventSubtitle"></p>
    </div>
  </div>

  <form id="joinForm" class="stack">
    <!-- 4.0.1: код можно ввести руками. Раньше сюда попадал только тот,
         кто пришёл по ссылке с кодом, а витрина закрыта: не отсканировал QR —
         и всё, выхода нет. -->
    <label class="field" id="codeField" hidden>
      <span>Код приглашения</span>
      <input id="codeInput" type="text" inputmode="latin" maxlength="12"
             autocapitalize="characters" autocomplete="off" spellcheck="false"
             placeholder="Например, KKTB6RQW" class="code-input">
      <span class="hint">
        Тот же код, что напечатан под QR-кодом. Регистр не важен.
      </span>
    </label>
    <label class="field">
      <span>Как вас зовут?</span>
      <input id="nameInput" type="text" maxlength="40" required
             placeholder="Например, Аня" autocomplete="name" autocapitalize="words">
    </label>
    <button class="btn btn-lg" type="submit" id="joinBtn">Продолжить</button>
    <p class="error" id="joinError" hidden></p>
  </form>

  <p class="fineprint">
    Имя увидит модератор и оно появится рядом с вашим сообщением.
    Регистрация привязана к этому браузеру — в следующий раз вход не потребуется.
  </p>
</main>

<script src="/static/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const invite = params.get('t') || '';
const form = document.getElementById('joinForm');
const btn = document.getElementById('joinBtn');
const err = document.getElementById('joinError');
const sub = document.getElementById('eventSubtitle');
const codeField = document.getElementById('codeField');
const codeInput = document.getElementById('codeInput');

/* Алфавит кода: заглавные, без похожих символов (0/O, 1/I).
   Приводим введённое к тому же виду, что отдаёт сервер, — иначе пробел
   от мобильной клавиатуры или строчная буква тихо ломают вход. */
function cleanCode(raw) {
  return String(raw || '')
    .toUpperCase()
    .replace(/[^A-Z2-9]/g, '')
    .slice(0, 12);
}

codeInput.addEventListener('input', () => {
  const clean = cleanCode(codeInput.value);
  if (clean !== codeInput.value) codeInput.value = clean;
});

/* Что сказать человеку, который сюда пришёл.

   4.0.1: витрина закрыта, и страница входа стала конечной точкой. Значит
   она обязана объяснять, почему входа не получилось.

   Раньше подпись «откройте по QR-коду» ставилась сразу, а ответ с
   настройками события приходил позже и затирал её пустым значением.
   Посетитель видел пустую карточку без единого слова.

   Решение принимает сервер: он знает, годен ли код, и говорит это полем
   inviteOk. Проверять надо именно его — inviteReason при верном коде
   приходит пустой строкой, а пустая строка ложна, и страница объявляла
   годный код негодным. */
function explain() {
  const lf = window.LF || {};
  const ok = ('inviteOk' in lf) ? !!lf.inviteOk : !!invite;
  if (ok) {
    codeField.hidden = true;            // код уже в адресе, вводить нечего
    return false;                       // подписью займётся конфиг события
  }
  sub.dataset.locked = '1';             // конфиг её больше не затрёт
  codeField.hidden = false;             // входим без всякого QR
  if (!invite) {
    sub.textContent = 'Введите код приглашения или откройте эту страницу по QR-коду.';
  } else {
    // код в адресе есть, но не подошёл: человек мог прийти по старой
    // ссылке. Сказать надо прямо, и дать ввести другой код руками
    sub.textContent =
      'Эта ссылка-приглашение не работает. Введите актуальный код или попросите новый QR-код.';
  }
  return true;
}

api(ev('/api/config')).then(cfg => {
  document.getElementById('eventTitle').textContent = cfg.event_title || 'Живая лента';
  if (!sub.dataset.locked) sub.textContent = cfg.event_subtitle || '';
}).catch(() => { explain(); });

explain();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.hidden = true;
  btn.disabled = true;
  btn.textContent = 'Проверяем…';
  // написанный код важнее адресного: человек мог прийти по старой
  // ссылке и вписать новый
  const typed = cleanCode(codeInput.value);
  const useCode = typed || invite;
  if (!useCode) {
    err.textContent = 'Введите код приглашения.';
    err.hidden = false;
    // кнопку разблокируем прямо здесь: если этого не сделать, она останется
    // серой иdisabled навсегда, и второй попытки не будет — человек уйдёт
    btn.disabled = false;
    btn.textContent = 'Продолжить';
    codeInput.focus();
    return;
  }
  try {
    const data = await apiForm(ev('/api/join'),
      { name: nameInput.value, invite: useCode });
    if (!data.ok) throw new Error(data.detail || 'Не получилось');
    location.href = ev('/send');
  } catch (ex) {
    err.textContent = ex.message || 'Что-то пошло не так. Попробуйте ещё раз.';
    err.hidden = false;
    // код не подошёл — пусть попробует вписать другой, не уходя со страницы
    codeField.hidden = false;
    if (!typed) codeInput.focus();
    btn.disabled = false;
    btn.textContent = 'Продолжить';
  }
});
</script>
</body>
</html>
