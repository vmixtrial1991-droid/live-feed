<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/forms.css">
</head>
<body class="form-page">

<main class="card card-narrow">
  <div class="brand center">
    <span class="brand-dot"></span>
    <div>
      <h1 id="eventTitle">Живая лента</h1>
      <p class="muted" id="eventSubtitle"></p>
    </div>
  </div>

  <form id="joinForm" class="stack">
    <label class="field">
      <span>Как вас зовут?</span>
      <input id="nameInput" type="text" maxlength="40" required
             placeholder="Например, Аня" autocomplete="name" autocapitalize="words">
    </label>
    <button class="btn btn-lg" type="submit" id="joinBtn">Продолжить</button>
    <p class="error" id="joinError" hidden></p>
  </form>

  <p class="fineprint">
    Имя увидит модератор и оно появится рядом с вашим сообщением.
    Регистрация привязана к этому браузеру — в следующий раз вход не потребуется.
  </p>
</main>

<script src="/static/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const invite = params.get('t') || '';
const form = document.getElementById('joinForm');
const btn = document.getElementById('joinBtn');
const err = document.getElementById('joinError');
const sub = document.getElementById('eventSubtitle');

/* Что сказать человеку, который сюда пришёл.

   4.0.1: витрина закрыта, и страница входа стала конечной точкой. Значит
   она обязана объяснять, почему входа не получилось.

   Раньше подпись «откройте по QR-коду» ставилась сразу, а ответ с
   настройками события приходил позже и затирал её пустым значением.
   Посетитель видел пустую карточку без единого слова. */
function explain() {
  const why = (window.LF && window.LF.inviteReason)
    || (invite ? 'bad_code' : 'no_code');
  if (why === 'no_code') {
    form.hidden = true;
    sub.textContent = 'Откройте эту страницу через QR-код приглашения.';
  } else {
    // код есть, но не подошёл. Форму прятать незачем: человек мог прийти
    // по старой ссылке, и сказать надо прямо, а не молчанием
    sub.textContent =
      'Эта ссылка-приглашение больше не работает. Попросите новый QR-код.';
  }
}

api(ev('/api/config')).then(cfg => {
  document.getElementById('eventTitle').textContent = cfg.event_title || 'Живая лента';
  // настройки события имеют право записать подпись только если никто
  // ещё ничего важного туда не написал
  if (!sub.dataset.locked) sub.textContent = cfg.event_subtitle || '';
}).catch(() => { explain(); });

// подпись занята нашим объяснением: конфиг её больше не затрёт
sub.dataset.locked = '1';
explain();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.hidden = true;
  btn.disabled = true;
  btn.textContent = 'Проверяем…';
  try {
    const data = await apiForm(ev('/api/join'), { name: nameInput.value, invite });
    if (!data.ok) throw new Error(data.detail || 'Не получилось');
    location.href = ev('/send');
  } catch (ex) {
    err.textContent = ex.message || 'Что-то пошло не так. Попробуйте ещё раз.';
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = 'Продолжить';
  }
});
</script>
</body>
</html>
