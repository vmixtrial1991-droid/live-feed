# Фрагмент для блока http{} в /etc/nginx/nginx.conf.
# Нужен для живой доставки: без него $connection_upgrade не определён
# и nginx не будет переключать соединение на WebSocket.
#
# Вставьте одну строку внутрь http { ... }:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# Либо положите этот файл в /etc/nginx/conf.d/ и добавьте
# в /etc/nginx/nginx.conf строку: include /etc/nginx/conf.d/*.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
