<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квиз</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/forms.css">
<link rel="stylesheet" href="/static/quiz.css">
</head>
<body class="quiz-page">

<header class="quiz-top">
  <div class="brand">
    <span class="brand-dot"></span>
    <div>
      <h1 id="eventTitle">Квиз</h1>
      <p class="muted" id="eventSubtitle"></p>
    </div>
  </div>
  <span class="pill" id="connPill" data-state="connecting">…</span>
</header>

<main class="quiz-main">

  <!-- Вход: тот же код приглашения, что у ленты. Кто уже отмечался —
       этот блок не увидит вообще: страница сразу откроет игру. -->
  <section class="card card-narrow" id="joinBox" hidden>
    <form id="joinForm" class="stack">
      <label class="field" id="codeField" hidden>
        <span>Код приглашения</span>
        <input id="codeInput" type="text" inputmode="latin" maxlength="12"
               autocapitalize="characters" autocomplete="off" spellcheck="false"
               placeholder="Например, KKTB6RQW" class="code-input">
        <span class="hint">Тот же код, что для отправки в ленту. Регистр не важен.</span>
      </label>
      <label class="field">
        <span>Как вас зовут?</span>
        <input id="nameInput" type="text" maxlength="40" required
               placeholder="Например, Аня" autocomplete="name" autocapitalize="words">
      </label>
      <button class="btn btn-lg" type="submit" id="joinBtn">Играем</button>
      <p class="error" id="joinError" hidden></p>
    </form>
    <p class="fineprint">
      Имя увидят все в таблице лидеров. Его можно поменять в любой момент —
      очки останутся вашими.
    </p>
  </section>

  <!-- Игра -->
  <section id="gameBox" hidden>
    <div class="quiz-you">
      <span>Вы играете как</span>
      <b id="myName">—</b>
      <button class="btn ghost small" id="renameBtn" type="button" title="Поменять имя">✎ имя</button>
      <span class="quiz-score" id="myScore" hidden></span>
    </div>

    <form class="quiz-rename" id="renameRow" hidden>
      <input id="renameInput" type="text" maxlength="40" placeholder="Новое имя"
             autocomplete="name" autocapitalize="words">
      <button class="btn small" id="renameSave" type="submit">Сохранить</button>
      <button class="btn ghost small" id="renameCancel" type="button">Отмена</button>
    </form>

    <!-- idle: квиз ещё не запущен. lobby: запущен, а первого вопроса ещё
         нет — зал подключается по QR на экране. Текст подписывает скрипт. -->
    <div class="quiz-wait" id="waitBox">
      <p class="big" id="waitTitle">Квиз ещё не начался</p>
      <p class="muted" id="waitHint">Ведущий откроет вопрос — и он появится здесь сам, ничего обновлять не нужно.</p>
    </div>

    <!-- open / closed: вопрос -->
    <div class="quiz-question-box" id="questionBox" hidden>
      <p class="quiz-qn" id="qnLabel"></p>
      <h2 class="quiz-question" id="questionText"></h2>
      <p class="quiz-nopoints" id="noPointsTag" hidden>Вопрос без очков — просто интересно, как думает зал</p>
      <div class="quiz-options" id="optionsBox"></div>
      <p class="quiz-hint" id="answerHint"></p>
    </div>

    <!-- board: таблица лидеров -->
    <div class="quiz-board-box" id="boardBox" hidden>
      <h2 class="quiz-board-title">Таблица лидеров</h2>
      <div class="quiz-board" id="boardList"></div>
      <p class="muted" id="boardMe"></p>
    </div>
  </section>

</main>

<script src="/static/common.js"></script>
<script src="/static/quiz.js"></script>
</body>
</html>
