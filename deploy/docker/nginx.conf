# nginx внутри контейнера: отдаёт приложение и закрытый QR-каталог ACME.
#
# Пока сертификата нет, сайт работает по http как обычный сайт. Редирект
# на https делает само приложение: оно смотрит на CERT_FILE и включает
# перекидывание только когда файл уже существует. Дублировать это в nginx
# не нужно — иначе без сертификата посетителя уводило бы в никуда.

# map живёт только в блоке http{}, а этот файл подключается как
# conf.d/default.conf, то есть тоже внутри http{} — всё в порядке
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # проверка домена на выпуск сертификата: без неё Let's Encrypt не выдаст его
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # WebSocket: без этих заголовков живой показ не заработает
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # показ слайдов идёт долго без запросов
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Скрипты и стили можно держать в кеше браузера: страницы ссылаются
    # на них с отметкой версии, поэтому после обновления ссылка меняется
    # и браузер приходит за файлами заново.
    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Фотографии неизменяемы: имя файла содержит время и случайную часть
    location /media/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Путь с $host — переменная, поэтому nginx не проверяет файл при старте
    # и поднимается даже без сертификата. Настоящее имя подставляет acme.sh
    # по фактически выпущенному сертификату.
    ssl_certificate     /etc/letsencrypt/live/$host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$host/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /media/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}