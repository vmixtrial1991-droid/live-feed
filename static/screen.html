<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/screen.css">
</head>
<body class="screen-page">

<div class="screen-stage" id="stage">
  <div class="slide" id="slide">
    <!-- фото, текст и подпись лежат рядом и центрируются вместе: так блок
         не разваливается, когда текст короткий и места много -->
    <div class="slide-inner" id="slideInner">
      <div class="slide-photo" id="slidePhoto" hidden></div>
      <div class="slide-text" id="slideText"></div>
      <div class="slide-author" id="slideAuthor"></div>
    </div>
  </div>
</div>

<div class="screen-overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-icon">📺</div>
    <h1 id="overlayTitle">Экран готов</h1>
    <p id="overlayText">Здесь появятся сообщения и фото.</p>
    <p class="muted" id="overlayHint"></p>
  </div>
</div>

<!-- Заставка на весь экран. Показывается поверх сообщений и снимается
     вторым нажатием кнопки в кабинете; появление и уход плавные. -->
<div class="splash" id="splash">
  <img class="splash-img" id="splashImg" alt="" hidden>
  <div class="splash-text" id="splashText">
    <h1 id="splashTitle"></h1>
    <p id="splashSubtitle"></p>
  </div>
</div>

<!-- Окно с QR-кодом: показ при этом стоит на паузе -->
<div class="qr-window" id="qrWindow" hidden>
  <div class="qr-window-inner">
    <h2 class="qr-window-title">Отсканируйте, чтобы отправить своё</h2>
    <div class="qr-window-code"><img id="screenQr" alt="QR-код для отправки" width="440" height="440"></div>
    <p class="qr-window-link" id="screenQrLink"></p>
    <p class="qr-window-hint">Показ сообщений остановлен. QR-код уберётся, когда нажмёте «QR на экране» в кабинете.</p>
  </div>
</div>

<!-- Квиз (5.0): тот же экран, только режим игры. Лента на это время
     встаёт. Слой лежит выше заставки и QR: если ведущий открыл вопрос,
     его должно быть видно при любом фоне. Сам слой не прячется через
     hidden — он накладывается на ленту градиентом и гаснет плавно. -->
<div class="quiz-screen" id="quizScreen">
  <!-- Холл игры: зал только подключается. Название события и QR, чтобы
     зрители попали в игру со своих телефонов, а вопроса ещё нет -->
  <div class="quiz-block quiz-lobby" id="quizLobby" hidden>
    <!-- .quiz-fit — то, что экран масштабирует целиком: длинный вопрос и
         четыре длинных варианта или таблица на десять человек в кадр не
         влезают при натуральном размере, а прокрутки на проекторе нет -->
    <div class="quiz-fit">
      <p class="quiz-tag">Квиз</p>
      <h1 class="quiz-lobby-title" id="lobbyTitle"></h1>
      <p class="quiz-lobby-sub" id="lobbySub" hidden></p>
      <div class="quiz-lobby-qr"><img id="lobbyQr" alt="QR-код квиза" width="420" height="420"></div>
      <p class="quiz-count" id="lobbyHint"></p>
    </div>
  </div>

  <div class="quiz-block quiz-screen-inner" id="quizPlay" hidden>
    <div class="quiz-fit">
      <p class="quiz-tag" id="quizTag"></p>
      <!-- Тело вопроса: без картинки это обычный столбик, с картинкой —
           две колонки (фото слева, вопрос и ответы справа) и ответы
           сеткой 2x2. Класс has-image ставит screen.js, когда у вопроса
           есть файл. -->
      <div class="quiz-body" id="quizBody">
        <div class="quiz-shot" id="quizShot" hidden>
          <img id="quizShotImg" alt="">
        </div>
        <div class="quiz-ask">
          <!-- Отсчёт живёт только здесь, на проекторе: телефоны не должны
               превращать игру в гонку. По истечении — надпись, но ответы всё
               ещё принимаются: приём закрывает ведущий, а не секундомер. -->
          <p class="quiz-s-timer" id="quizTimer" hidden></p>
          <h1 class="quiz-q" id="quizQText"></h1>
          <div class="quiz-opts" id="quizOpts"></div>
          <p class="quiz-count" id="quizCount"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/screen.js"></script>
</body>
</html>
